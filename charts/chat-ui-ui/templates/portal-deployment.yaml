{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chat-ui-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: portal-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "chat-ui-ui.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-ui
      annotations:
        checksum/portal-config: {{ include (print $.Template.BasePath "/portal-configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: portal-config
              mountPath: /usr/share/nginx/html/pm-content.json
              subPath: pm-content.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/configuration.json
              subPath: ord-configuration.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/documents/chat-ui.json
              subPath: ord-chat-ui.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/documents/openai-chat-contract.json
              subPath: ord-openai-chat-contract.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/definitions/chat-ui.oas3.json
              subPath: ord-chat-ui.oas3.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ord/definitions/openai-chat-completions.oas3.json
              subPath: ord-openai-chat-completions.oas3.json
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/index.html
              subPath: ord-renderer-index.html
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/styles.css
              subPath: ord-renderer-styles.css
            - name: portal-config
              mountPath: /usr/share/nginx/html/ui-extensions/ord/renderer.js
              subPath: ord-renderer.js
            - name: portal-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: portal-config
          configMap:
            name: {{ .Release.Name }}-portal-config
            items:
              - key: pm-content.json
                path: pm-content.json
              - key: ord-configuration.json
                path: ord-configuration.json
              - key: ord-chat-ui.json
                path: ord-chat-ui.json
              - key: ord-openai-chat-contract.json
                path: ord-openai-chat-contract.json
              - key: ord-chat-ui.oas3.json
                path: ord-chat-ui.oas3.json
              - key: ord-openai-chat-completions.oas3.json
                path: ord-openai-chat-completions.oas3.json
              - key: ord-renderer-index.html
                path: ord-renderer-index.html
              - key: ord-renderer-styles.css
                path: ord-renderer-styles.css
              - key: ord-renderer.js
                path: ord-renderer.js
              - key: nginx-default.conf
                path: nginx-default.conf
{{- end }}
