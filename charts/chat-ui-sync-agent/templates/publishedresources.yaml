{{- if .Values.publishedResources.enabled }}
{{- $ns := (.Values.publishedResources.namespace | default .Release.Namespace) }}
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-chat-ui-instances
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: chat-ui-sync-agent
    app.kubernetes.io/component: portal-integration
spec:
  resource:
    kind: ChatUIInstance
    apiGroup: ui.privatellms.msp
    version: v1alpha1
  naming:
    namespace: {{ .Values.publishedResources.naming.namespace | quote }}
    name: "{{`{{ .Object.metadata.name }}`}}"
{{- $loginSecretValues := .Values.publishedResources.loginSecrets | default dict }}
{{- $loginSecrets := $loginSecretValues.enabled }}
{{- if or .Values.publishedResources.credentialSecrets.enabled $loginSecrets }}
  related:
{{- if .Values.publishedResources.credentialSecrets.enabled }}
    - identifier: credentials-secret
      origin: kcp
      kind: Secret
      object:
        reference:
          path: spec.credentialsSecretRef.name
{{- end }}
{{- if $loginSecrets }}
    # Password access: publish the operator-generated login Secret into the
    # account that owns the instance. The name comes from operator-written status,
    # never from the tenant's spec. Resolved by template so that an instance
    # without a login Secret renders an empty name and is skipped, on both sides.
    - identifier: login-secret
      origin: service
      kind: Secret
      {{- if $loginSecretValues.cleanup }}
      cleanup: true
      {{- end }}
      object:
        template:
          template: "{{`{{ with .Object.status }}{{ with .loginSecretName }}{{ . }}{{ end }}{{ end }}`}}"
{{- end }}
{{- end }}
{{- end }}
