syncAgentOperator:
  enabled: true
  apiExportName: ui.privatellms.msp
  apiExportEndpointSliceName: ui.privatellms.msp
  agentName: chat-ui-agent
  kcpKubeconfig: pm-kcp-kubeconfig
  extraFlags: []
  crds:
    enabled: false
  hostAliases:
    enabled: false
    # For local Platform Mesh setup (Kind cluster):
    # enabled: true
    # values:
    #   - ip: "10.96.x.x"  # Traefik ClusterIP — run: kubectl get svc traefik -o jsonpath='{.spec.clusterIP}'
    #     hostnames:
    #       - "root.kcp.localhost"
    #       - "kcp.localhost"

publishedResources:
  enabled: true
  namespace: api-syncagent
  serviceAccountName: chat-ui-sync-agent
  naming:
    # Separate each account and source namespace. Keep this stable after resources exist.
    namespace: 'chat-{{ printf "%s-%s" .ClusterName .Object.metadata.namespace | trunc 36 | trimAll "-." }}-{{ printf "%s/%s" .ClusterName .Object.metadata.namespace | sha3short }}'
  credentialSecrets:
    enabled: true
  # Publishes the generated login Secret of instances that use password access
  # (operator accessPolicy.passwordFallback). No effect for mapped instances.
  loginSecrets:
    enabled: true
    # Delete the published copy when its ChatUIInstance is deleted. The field exists
    # from api-syncagent v0.7.0; the bundled chart 0.5.1 defaults to an older agent.
    cleanup: false
