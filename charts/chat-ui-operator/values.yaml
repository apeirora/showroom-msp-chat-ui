image:
  repository: ghcr.io/apeirora/chat-ui-controller
  tag: 0.14.4-rc.1
  pullPolicy: IfNotPresent
  imagePullSecrets: []
manager:
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
hostnamePolicy:
  cutover: ''
  entries: []
accessPolicy:
  kcpServer: ''
  kcpCA: ''
  credentialsNamespace: ''
  proxyImage: ''
  entries: []
clientSecrets: []
env:
  PUBLIC_HOST: chat.localhost
  PUBLIC_SCHEME: https
  INGRESS_EXTRA_ANNOTATIONS: '{}'
  TLS_SECRET_NAME: ''
rbac:
  create: true
serviceAccount:
  create: true
  name: ''
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
