image:
  repository: ghcr.io/apeirora/chat-ui-controller
  tag: 0.14.3
  pullPolicy: IfNotPresent
  imagePullSecrets: []
manager:
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Required before deployment. Use a fixed inventory timestamp, never template "now".
# Entries bind service-cluster UID, namespace and name; see docs/hostname-policy.md.
hostnamePolicy:
  cutover: ''
  entries: []
# Required: reviewed source identities and the released access-proxy image digest.
# No credential values belong here. Client Secrets live in credentialsNamespace.
accessPolicy:
  kcpServer: ''
  kcpCA: ''
  credentialsNamespace: ''
  proxyImage: ''
  entries: []
env:
  PUBLIC_HOST: chat.localhost
  PUBLIC_SCHEME: https
  INGRESS_EXTRA_ANNOTATIONS: '{}'
  TLS_SECRET_NAME: ''
rbac:
  create: true
serviceAccount:
  create: true
  name: ''
metrics:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
