{{- $names := dict }}
{{- range .Values.clientSecrets }}
{{- $name := required "clientSecrets[].name is required" .name }}
{{- if hasKey $names $name }}
{{- fail "clientSecrets contains a duplicate target name" }}
{{- end }}
{{- $_ := set $names $name true }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ required "accessPolicy.credentialsNamespace is required for clientSecrets" $.Values.accessPolicy.credentialsNamespace | quote }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: {{ required "clientSecrets[].secretStoreName is required" .secretStoreName | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ required "clientSecrets[].remoteKey is required" .remoteKey | quote }}
        property: client_secret
{{- end }}
