{{- if .Values.rbac.create }}
{{- with .Values.accessPolicy.enrollment }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chatui.fullname" $ }}-enrollment-reader
  namespace: {{ required "accessPolicy.credentialsNamespace is required for enrollment" $.Values.accessPolicy.credentialsNamespace | quote }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ required "enrollment.configMapName is required" .configMapName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chatui.fullname" $ }}-enrollment-reader
  namespace: {{ $.Values.accessPolicy.credentialsNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chatui.fullname" $ }}-enrollment-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "chatui.saName" $ }}
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}
{{- end }}
